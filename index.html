<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets Dashboard</title>
    <style>
        /* Modern animated gradient background to make the glass stand out */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #00d2ff 100%);
            background-size: 200% 200%;
            animation: gradientBg 10s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Dashboard Container */
        .dashboard-container {
            width: 90%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Liquid Glass Buttons */
        .liquid-button {
            position: relative;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            color: white;
            font-size: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            overflow: hidden;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        /* The sweeping light "liquid" effect */
        .liquid-button::before {
            content: '';
            position: absolute;
            top: 0; 
            left: -100%;
            width: 50%; 
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-20deg);
            transition: all 0.6s ease;
        }

        .liquid-button:hover::before {
            left: 150%;
        }

        .liquid-button:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transform: translateY(-2px);
        }

        /* Table Styles */
        .data-display {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            min-height: 200px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background: rgba(255, 255, 255, 0.1);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.05);
        }

        .loading, .placeholder {
            text-align: center;
            opacity: 0.7;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>Dashboard Data View</h1>
        
        <div class="button-group">
            <!-- Buttons trigger the loadData function with their respective URLs -->
            <button class="liquid-button" onclick="loadData('url1')">Load Dataset 1</button>
            <button class="liquid-button" onclick="loadData('url2')">Load Dataset 2</button>
        </div>

        <div class="data-display" id="data-display">
            <p class="placeholder">Select a dataset above to fetch and view your Google Sheet data.</p>
        </div>
    </div>

    <script>
        // Your published CSV URLs
        const csvUrls = {
            url1: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRS7yU5NpBw6DGLuiA0zXpJlE1jp9saFRcxkD6mtps49cALrYL2CSwtnpZZ7OwivsudXU2YtQhT9zIi/pub?output=csv',
            url2: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS3XOU4ON_iq0P7JvQH_Re_uoZVZKGWSfSZcjFZjn1D5bPEzIOsx6r4Al69__5kMnDYmdQH4XW5R35b/pub?output=csv'
        };

        async function loadData(sourceKey) {
            const display = document.getElementById('data-display');
            display.innerHTML = '<p class="loading">Fetching data from Google Sheets...</p>';

            try {
                // Fetch the CSV data
                const response = await fetch(csvUrls[sourceKey]);
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const csvText = await response.text();
                
                // Parse CSV and render it to the dashboard
                display.innerHTML = generateTableFromCSV(csvText);

            } catch (error) {
                console.error('Error fetching data:', error);
                display.innerHTML = `<p class="placeholder" style="color: #ffb3b3;">Error loading data. Please check if the Google Sheet is published correctly.</p>`;
            }
        }

        // Basic function to convert CSV text into an HTML table
        function generateTableFromCSV(csvText) {
            // Split into rows by line break
            const rows = csvText.split('\n').filter(row => row.trim().length > 0);
            
            let html = '<table>';
            
            rows.forEach((row, index) => {
                // Note: For complex CSVs with commas inside text (e.g. "Smith, John"), 
                // you would need a Regex parser like: row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                const columns = row.split(',');

                if (index === 0) {
                    // Create Table Headers for the first row
                    html += '<thead><tr>';
                    columns.forEach(col => {
                        html += `<th>${col.replace(/"/g, '').trim()}</th>`;
                    });
                    html += '</tr></thead><tbody>';
                } else {
                    // Create Table Data for remaining rows
                    html += '<tr>';
                    columns.forEach(col => {
                        html += `<td>${col.replace(/"/g, '').trim()}</td>`;
                    });
                    html += '</tr>';
                }
            });

            html += '</tbody></table>';
            return html;
        }
    </script>
</body>
</html>
