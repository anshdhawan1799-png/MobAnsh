<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b1020" />
<title>Campaign Control — Live Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg-deep:#0b1020;
    --teal:#5eead4;
    --violet:#a78bfa;
    --coral:#fb7185;
    --glass-fill:rgba(255,255,255,.07);
    --glass-fill-strong:rgba(255,255,255,.13);
    --glass-border:rgba(255,255,255,.22);
    --glass-border-soft:rgba(255,255,255,.12);
    --text-1:#f1f5f9;
    --text-2:#a8b3c4;
    --text-3:#6b7793;
    --good:#34d399;
    --warn:#fbbf24;
    --risk:#fb7185;
    --radius-lg:28px;
    --radius-md:20px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100vh;}
  body{
    background:
      radial-gradient(1200px 800px at 15% -10%, #16204a 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #1a1030 0%, transparent 55%),
      var(--bg-deep);
    color:var(--text-1);
    font-family:var(--font-body);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.32;mix-blend-mode:screen;}
  .b1{width:520px;height:520px;background:var(--teal);top:-140px;left:-100px;animation:float1 26s ease-in-out infinite;}
  .b2{width:600px;height:600px;background:var(--violet);bottom:-220px;right:-160px;animation:float2 30s ease-in-out infinite;}
  .b3{width:420px;height:420px;background:var(--coral);top:38%;left:58%;animation:float3 22s ease-in-out infinite;}
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,40px)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-30px)}}
  @keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,50px)}}
  @media (prefers-reduced-motion: reduce){ .blob{animation:none !important;} }

  .glass{
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -1px 14px rgba(255,255,255,.03), 0 8px 30px rgba(0,0,0,.35);
    position:relative;
    isolation:isolate;
  }
  .glass::before{
    content:"";
    position:absolute; inset:0; border-radius:inherit;
    background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 42%);
    opacity:.5; pointer-events:none; mix-blend-mode:overlay; z-index:1;
  }
  .card.glass::after{
    content:"";
    position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:1;
    background:radial-gradient(220px circle at var(--mx,50%) var(--my,10%), rgba(255,255,255,.28), transparent 60%);
    opacity:0; transition:opacity .35s ease;
  }
  .card.glass:hover::after, .card.glass:focus-visible::after{opacity:1;}

  #app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 24px 70px;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
    border-radius:var(--radius-lg);padding:20px 26px;margin-bottom:32px;
    position:sticky; top:16px; z-index:10;
  }
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);position:relative;z-index:2;}
  h1{font-family:var(--font-display);font-size:clamp(22px,3vw,32px);margin:4px 0 3px;font-weight:700;letter-spacing:-.01em;position:relative;z-index:2;}
  .meta{font-size:12.5px;color:var(--text-2);margin:0;font-family:var(--font-mono);position:relative;z-index:2;}

  .controls{display:flex;align-items:center;gap:12px;position:relative;z-index:2;}
  .segmented{display:flex;padding:4px;border-radius:999px;gap:4px;}
  .seg-btn{border:none;background:transparent;color:var(--text-2);padding:9px 18px;border-radius:999px;font-family:var(--font-body);font-weight:600;font-size:13.5px;cursor:pointer;transition:all .25s ease;}
  .seg-btn.active{background:var(--glass-fill-strong);color:var(--text-1);box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 2px 10px rgba(0,0,0,.25);}
  .seg-btn:hover:not(.active){color:var(--text-1);}

  .icon-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--glass-border);background:var(--glass-fill);color:var(--text-1);cursor:pointer;transition:transform .2s ease, background .2s ease;flex-shrink:0;}
  .icon-btn:hover{background:var(--glass-fill-strong); transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.96);}
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn.spinning svg{animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  button{font-family:inherit;}
  button:focus-visible, .card:focus-visible{outline:2px solid var(--teal); outline-offset:3px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}

  .card{
    border-radius:var(--radius-md);
    padding:22px 22px 20px;
    cursor:pointer;
    display:flex;flex-direction:column;gap:13px;
    transition:transform .3s ease, box-shadow .3s ease;
    text-align:left;
  }
  .card:hover{transform:translateY(-4px);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;gap:10px;}
  .sr-badge{font-family:var(--font-mono);font-size:11px;color:var(--text-3);border:1px solid var(--glass-border-soft);padding:3px 8px;border-radius:999px;white-space:nowrap;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .status-pill .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .status-pill.good{color:var(--good);background:rgba(52,211,153,.13);}
  .status-pill.good .dot{background:var(--good);}
  .status-pill.warn{color:var(--warn);background:rgba(251,191,36,.13);}
  .status-pill.warn .dot{background:var(--warn);}
  .status-pill.risk{color:var(--risk);background:rgba(251,113,133,.15);}
  .status-pill.risk .dot{background:var(--risk);}

  .client-name{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0;position:relative;z-index:2;}
  .spend-row{position:relative;z-index:2;}
  .spend-value{font-family:var(--font-mono);font-size:25px;font-weight:500;color:var(--text-1);}
  .spend-value.muted{color:var(--text-3);font-size:15px;}
  .spend-label{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:2px;}
  .status-preview{font-size:13.5px;color:var(--text-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;position:relative;z-index:2;}
  .next-step{font-size:11.5px;color:var(--violet);background:rgba(167,139,250,.13);padding:6px 10px;border-radius:10px;display:inline-block;position:relative;z-index:2;align-self:flex-start;}

  .view-more{align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--text-1);background:none;border:none;padding:0;display:flex;align-items:center;gap:5px;cursor:pointer;position:relative;z-index:2;}
  .view-more svg{width:14px;height:14px;transition:transform .2s ease;}
  .card:hover .view-more svg{transform:translateX(3px);}

  .manager-card .count-badge{font-family:var(--font-mono);font-size:25px;color:var(--text-1);position:relative;z-index:2;}
  .pub-chip-row{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:2;}
  .chip{font-family:var(--font-mono);font-size:11px;color:var(--text-2);background:rgba(255,255,255,.05);border:1px solid var(--glass-border-soft);padding:3px 8px;border-radius:8px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(4,7,18,.62);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .modal-overlay[hidden]{display:none;}
  .modal{max-width:640px;width:100%;max-height:85vh;overflow-y:auto;border-radius:26px;padding:34px;position:relative;}
  .modal-close{position:absolute;top:16px;right:16px;font-size:18px;line-height:1;z-index:3;}
  .modal h2{font-family:var(--font-display);font-size:25px;margin:0 0 8px;position:relative;z-index:2;padding-right:30px;}
  .modal-topline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:2;margin-bottom:14px;}
  .modal .full-status{white-space:pre-line;color:var(--text-2);font-size:14px;line-height:1.65;margin:14px 0;position:relative;z-index:2;}
  .modal-section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);margin:22px 0 10px;font-family:var(--font-mono);position:relative;z-index:2;}
  .manager-row, .client-row{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--glass-border-soft);position:relative;z-index:2;}
  .manager-row:first-child, .client-row:first-child{border-top:none;}
  .row-name{font-weight:600;font-size:14px;}
  .empty-note{color:var(--text-3);font-size:13px;font-style:italic;position:relative;z-index:2;}
  .modal-spend{font-family:var(--font-mono);}

  .skeleton{border-radius:var(--radius-md);height:186px;background:linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.1), rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.6s infinite;}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  @media (prefers-reduced-motion: reduce){ .skeleton{animation:none;} }

  .error-card{grid-column:1/-1;text-align:center;padding:44px 24px;border-radius:var(--radius-md);}
  .error-card h3{font-family:var(--font-display);margin:10px 0 6px;}
  .error-card p{color:var(--text-2);font-size:13.5px;margin:0 0 16px;}
  .retry-btn{padding:10px 22px;border-radius:999px;border:1px solid var(--glass-border);background:var(--glass-fill-strong);color:var(--text-1);font-weight:600;cursor:pointer;}
  .retry-btn:hover{background:rgba(255,255,255,.18);}

  .footer{text-align:center;color:var(--text-3);font-size:11.5px;margin-top:48px;font-family:var(--font-mono);line-height:1.6;}

  @media (max-width:640px){
    .topbar{position:static;padding:18px 18px;}
    .controls{width:100%;justify-content:space-between;}
    .modal{padding:26px 22px;border-radius:20px;}
  }
</style>
</head>
<body>

<div class="blobs" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div id="app">
  <header class="topbar glass">
    <div class="brand">
      <span class="eyebrow">Live · Publisher Ops</span>
      <h1>Campaign Control</h1>
      <p class="meta" id="metaLine">Loading sheet…</p>
    </div>
    <div class="controls">
      <div class="segmented glass" role="tablist" aria-label="Dashboard view">
        <button class="seg-btn active" data-tab="clients" role="tab" aria-selected="true">Clients</button>
        <button class="seg-btn" data-tab="managers" role="tab" aria-selected="false">Managers</button>
      </div>
      <button id="refreshBtn" class="icon-btn glass" aria-label="Refresh data" title="Refresh data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>
  </header>

  <main id="mainArea">
    <section id="clientsView" class="grid" role="tabpanel"></section>
    <section id="managersView" class="grid" role="tabpanel" hidden></section>
  </main>

  <p class="footer">Synced straight from the published Google Sheet. Google can take a few minutes to reflect new edits.</p>
</div>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div id="modalPanel" class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="icon-btn glass modal-close" id="modalClose" aria-label="Close">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// ---- Configuration ----------------------------------------------------
// Swap this URL to point the dashboard at a different published sheet.
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRS7yU5NpBw6DGLuiA0zXpJlE1jp9saFRcxkD6mtps49cALrYL2CSwtnpZZ7OwivsudXU2YtQhT9zIi/pub?output=csv";
const AUTO_REFRESH_MS = 5 * 60 * 1000; // silently re-fetch every 5 minutes

// ---- State --------------------------------------------------------------
let clients = [];
let managers = [];
let clientNames = [];
let activeTab = "clients";
let lastFocusedEl = null;

// ---- DOM refs -------------------------------------------------------------
const clientsView = document.getElementById("clientsView");
const managersView = document.getElementById("managersView");
const metaLine = document.getElementById("metaLine");
const refreshBtn = document.getElementById("refreshBtn");
const modalOverlay = document.getElementById("modalOverlay");
const modalPanel = document.getElementById("modalPanel");
const modalContent = document.getElementById("modalContent");
const modalClose = document.getElementById("modalClose");

// ---- Helpers --------------------------------------------------------------
function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function splitList(cell){
  if(!cell) return [];
  return cell.split(",").map(s => s.trim()).filter(Boolean);
}

function classifyStatus(text){
  if(!text) return "good";
  const t = text.toLowerCase();
  const riskWords = ["reject", "no conversion", "low app performance", "low performance"];
  const warnWords = ["due", "cap", "capped", "reached", "check"];
  if(riskWords.some(k => t.includes(k))) return "risk";
  if(warnWords.some(k => t.includes(k))) return "warn";
  return "good";
}
const STATUS_LABEL = { good: "On track", warn: "Needs attention", risk: "At risk" };

function formatSpend(v){
  const n = parseFloat(v);
  if(!v || isNaN(n)) return null;
  return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function findClientByName(name){
  return clients.find(c => c.name.toLowerCase() === name.toLowerCase());
}

// ---- CSV parsing ------------------------------------------------------
// The sheet holds two tables side by side: a client-status table (cols 0-3
// plus a notes column) and a publisher-manager table (starts wherever the
// second "Sr. No." header appears). We detect that split dynamically so the
// dashboard keeps working if columns are added later.
function processRows(rows){
  const headerRow = rows[1] || [];
  let rightStart = -1, seen = 0;
  for(let i = 0; i < headerRow.length; i++){
    const norm = (headerRow[i] || "").trim().toLowerCase();
    if(norm.startsWith("sr")){
      seen++;
      if(seen === 2){ rightStart = i; break; }
    }
  }
  if(rightStart === -1) rightStart = 6; // fallback matching the known layout

  const namesLocal = headerRow.slice(rightStart + 2).map(c => (c || "").trim()).filter(Boolean);

  const clientsLocal = [];
  const managersLocal = [];

  for(let r = 2; r < rows.length; r++){
    const row = rows[r];
    if(!row) continue;

    const clientName = (row[1] || "").trim();
    if(clientName){
      const notes = row.slice(4, rightStart).map(c => (c || "").trim()).filter(Boolean);
      clientsLocal.push({
        srNo: (row[0] || "").trim(),
        name: clientName,
        status: (row[2] || "").trim(),
        spends: (row[3] || "").trim(),
        action: notes[0] || ""
      });
    }

    const managerName = (row[rightStart + 1] || "").trim();
    if(managerName){
      const byClient = {};
      namesLocal.forEach((cn, idx) => {
        byClient[cn] = splitList(row[rightStart + 2 + idx]);
      });
      managersLocal.push({
        srNo: (row[rightStart] || "").trim(),
        name: managerName,
        byClient
      });
    }
  }

  clients = clientsLocal;
  managers = managersLocal;
  clientNames = namesLocal;
}

function updateMeta(rows){
  const titleCell = (rows[0] && rows[0][0]) || "";
  const dateMatch = titleCell.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  let sheetDate = "";
  if(dateMatch){
    const d = new Date(`${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}`);
    sheetDate = d.toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" });
  }
  const syncedAt = new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  metaLine.textContent = sheetDate
    ? `Sheet marked ${sheetDate} · Synced ${syncedAt}`
    : `Synced ${syncedAt}`;
}

// ---- Rendering: Clients tab --------------------------------------------
function clientCardHtml(c, idx){
  const sentiment = classifyStatus(c.status);
  const spend = formatSpend(c.spends);
  return `
    <button class="card glass" data-client="${idx}" aria-haspopup="dialog">
      <div class="card-top">
        <span class="sr-badge">No. ${escapeHtml(c.srNo || String(idx + 1))}</span>
        <span class="status-pill ${sentiment}"><span class="dot"></span>${STATUS_LABEL[sentiment]}</span>
      </div>
      <h3 class="client-name">${escapeHtml(c.name)}</h3>
      <div class="spend-row">
        <span class="spend-label">Spend</span>
        ${spend ? `<span class="spend-value">${spend}</span>` : `<span class="spend-value muted">No spend logged</span>`}
      </div>
      ${c.status ? `<p class="status-preview">${escapeHtml(c.status)}</p>` : ""}
      ${c.action ? `<span class="next-step">Next: ${escapeHtml(c.action)}</span>` : ""}
      <span class="view-more">View details
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </span>
    </button>
  `;
}

function renderClients(){
  if(!clients.length){
    clientsView.innerHTML = `<div class="error-card glass"><h3>No clients found</h3><p>The sheet loaded, but no client rows were recognized.</p></div>`;
    return;
  }
  clientsView.innerHTML = clients.map(clientCardHtml).join("");
  clientsView.querySelectorAll("[data-client]").forEach(btn => {
    btn.addEventListener("click", () => openClientModal(clients[parseInt(btn.dataset.client, 10)]));
  });
}

// ---- Rendering: Managers tab --------------------------------------------
function managerCardHtml(m, idx){
  const total = clientNames.reduce((sum, cn) => sum + (m.byClient[cn] || []).length, 0);
  const chips = clientNames
    .filter(cn => (m.byClient[cn] || []).length)
    .map(cn => `<span class="chip">${escapeHtml(cn)} · ${m.byClient[cn].length}</span>`)
    .join("");
  return `
    <button class="card manager-card glass" data-manager="${idx}" aria-haspopup="dialog">
      <div class="card-top">
        <span class="sr-badge">No. ${escapeHtml(m.srNo || String(idx + 1))}</span>
      </div>
      <h3 class="client-name">${escapeHtml(m.name)}</h3>
      <div class="spend-row">
        <span class="spend-label">Publishers managed</span>
        <span class="count-badge">${total}</span>
      </div>
      <div class="pub-chip-row">${chips || `<span class="chip">No assignments yet</span>`}</div>
      <span class="view-more">View breakdown
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </span>
    </button>
  `;
}

function renderManagers(){
  if(!managers.length){
    managersView.innerHTML = `<div class="error-card glass"><h3>No publisher managers found</h3><p>The sheet loaded, but no manager rows were recognized.</p></div>`;
    return;
  }
  managersView.innerHTML = managers.map(managerCardHtml).join("");
  managersView.querySelectorAll("[data-manager]").forEach(btn => {
    btn.addEventListener("click", () => openManagerModal(managers[parseInt(btn.dataset.manager, 10)]));
  });
}

// ---- Modals ---------------------------------------------------------------
function openClientModal(c){
  const sentiment = classifyStatus(c.status);
  const spend = formatSpend(c.spends);

  const managerRows = managers
    .map(m => ({ m, pubs: m.byClient[c.name] || (clientNames.find(cn => cn.toLowerCase() === c.name.toLowerCase()) ? m.byClient[clientNames.find(cn => cn.toLowerCase() === c.name.toLowerCase())] : []) }))
    .filter(r => r.pubs && r.pubs.length);

  const managerHtml = managerRows.length
    ? managerRows.map(r => `
        <div class="manager-row">
          <span class="row-name">${escapeHtml(r.m.name)}</span>
          <div class="pub-chip-row">${r.pubs.map(p => `<span class="chip">${escapeHtml(p)}</span>`).join("")}</div>
        </div>
      `).join("")
    : `<p class="empty-note">No publishers logged for this client yet.</p>`;

  modalContent.innerHTML = `
    <h2 id="modalTitle">${escapeHtml(c.name)}</h2>
    <div class="modal-topline">
      <span class="status-pill ${sentiment}"><span class="dot"></span>${STATUS_LABEL[sentiment]}</span>
      ${spend ? `<span class="modal-spend">${spend} spent</span>` : `<span class="modal-spend" style="color:var(--text-3)">No spend logged</span>`}
    </div>
    ${c.status ? `<p class="full-status">${escapeHtml(c.status)}</p>` : ""}
    ${c.action ? `<span class="next-step">Next: ${escapeHtml(c.action)}</span>` : ""}
    <p class="modal-section-title">Publisher managers on this account</p>
    ${managerHtml}
  `;
  showModal();
}

function openManagerModal(m){
  const clientHtml = clientNames
    .filter(cn => (m.byClient[cn] || []).length)
    .map(cn => `
      <div class="client-row">
        <span class="row-name">${escapeHtml(cn)}</span>
        <div class="pub-chip-row">${m.byClient[cn].map(p => `<span class="chip">${escapeHtml(p)}</span>`).join("")}</div>
      </div>
    `).join("");

  modalContent.innerHTML = `
    <h2 id="modalTitle">${escapeHtml(m.name)}</h2>
    <p class="modal-section-title">Publishers by client</p>
    ${clientHtml || `<p class="empty-note">No publishers assigned to this manager yet.</p>`}
  `;
  showModal();
}

function showModal(){
  lastFocusedEl = document.activeElement;
  modalOverlay.hidden = false;
  modalClose.focus();
  document.body.style.overflow = "hidden";
}
function hideModal(){
  modalOverlay.hidden = true;
  document.body.style.overflow = "";
  if(lastFocusedEl) lastFocusedEl.focus();
}
modalClose.addEventListener("click", hideModal);
modalOverlay.addEventListener("click", e => { if(e.target === modalOverlay) hideModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && !modalOverlay.hidden) hideModal(); });

// ---- Tabs -----------------------------------------------------------------
document.querySelectorAll(".seg-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll(".seg-btn").forEach(b => {
      b.classList.toggle("active", b === btn);
      b.setAttribute("aria-selected", b === btn ? "true" : "false");
    });
    clientsView.hidden = activeTab !== "clients";
    managersView.hidden = activeTab !== "managers";
  });
});

// ---- Cursor sheen (the liquid-glass signature) ---------------------------
document.getElementById("mainArea").addEventListener("mousemove", e => {
  const card = e.target.closest(".card");
  if(!card) return;
  const rect = card.getBoundingClientRect();
  card.style.setProperty("--mx", ((e.clientX - rect.left) / rect.width) * 100 + "%");
  card.style.setProperty("--my", ((e.clientY - rect.top) / rect.height) * 100 + "%");
});

// ---- Loading / error states ----------------------------------------------
function showSkeletons(){
  const skel = Array.from({ length: 6 }).map(() => `<div class="skeleton"></div>`).join("");
  clientsView.innerHTML = skel;
  managersView.innerHTML = skel;
  metaLine.textContent = "Loading sheet…";
}
function showError(err){
  const html = `
    <div class="error-card glass">
      <h3>Couldn't load campaign data</h3>
      <p>${escapeHtml(err && err.message ? err.message : "Check your connection and that the sheet is still published, then try again.")}</p>
      <button class="retry-btn" id="retryBtn">Try again</button>
    </div>
  `;
  clientsView.innerHTML = html;
  managersView.innerHTML = html;
  document.querySelectorAll("#retryBtn").forEach(b => b.addEventListener("click", loadData));
  metaLine.textContent = "Sync failed";
}

// ---- Data loading -----------------------------------------------------
async function loadData(isSilent){
  if(!isSilent){
    showSkeletons();
    refreshBtn.classList.add("spinning");
  }
  try{
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if(!res.ok) throw new Error(`Sheet responded with HTTP ${res.status}`);
    const text = await res.text();
    const parsed = Papa.parse(text.trim(), { skipEmptyLines: false });
    processRows(parsed.data);
    renderClients();
    renderManagers();
    updateMeta(parsed.data);
  }catch(err){
    console.error("Dashboard load error:", err);
    if(!isSilent) showError(err);
  }finally{
    refreshBtn.classList.remove("spinning");
  }
}

refreshBtn.addEventListener("click", () => loadData(false));

loadData(false);
setInterval(() => loadData(true), AUTO_REFRESH_MS);
</script>
</body>
</html>
